[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autostars"
version = "0.3.0"
description = "Standalone FunPay Stars automation"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "RedWhite"}]

[tool.setuptools]
py-modules = ["main", "gui", "check_env"]

[tool.ruff]
line-length = 100
target-version = "py310"
