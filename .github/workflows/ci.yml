name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      # The released FunPayAPI pins requests==2.28.1 while pytoniq-core
      # (used by tonutils) requires requests>=2.31. Keep the CI environment
      # compatible with the working application instead of resolving the
      # intentionally conflicting requirements.txt as one set.
      - run: |
          python -m pip install "flet==0.86.1"
          python -m pip install "requests>=2.31,<3"
          python -m pip install --no-deps "FunPayAPI==1.1.0"
          python -m pip install "aiogram==3.4.1" "httpx>=0.27,<1" "tonutils==0.5.8"
      - run: python -m py_compile main.py gui.py check_env.py
      - run: python -m unittest discover -s tests -v
